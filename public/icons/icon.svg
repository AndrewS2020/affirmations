<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="lotusGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="lotusGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient glow circle -->
  <circle cx="256" cy="256" r="180" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
  
  <!-- Lotus Petals (Mindfulness symbol) -->
  <g transform="translate(256, 270) scale(1.1)" filter="url(#glow)">
    <!-- Back outer petals -->
    <path d="M 0,-130 C -80,-80 -130,-10 -110,40 C -80,60 -30,40 0,30 C 30,40 80,60 110,40 C 130,-10 80,-80 0,-130 Z" fill="url(#lotusGrad2)" opacity="0.6"/>
    
    <!-- Mid petals Left & Right -->
    <path d="M 0,20 C -70,20 -120,-30 -90,-80 C -50,-60 -20,-20 0,20 Z" fill="url(#lotusGrad1)" opacity="0.85"/>
    <path d="M 0,20 C 70,20 120,-30 90,-80 C 50,-60 20,-20 0,20 Z" fill="url(#lotusGrad1)" opacity="0.85"/>
    
    <!-- Center core petal -->
    <path d="M 0,-110 C -40,-60 -35,0 0,25 C 35,0 40,-60 0,-110 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 0,-95 C -25,-50 -20,0 0,20 C 20,0 25,-50 0,-95 Z" fill="url(#lotusGrad1)"/>
    
    <!-- Center glowing pearl -->
    <circle cx="0" cy="15" r="9" fill="#fff" filter="url(#glow)"/>
  </g>

  <!-- Star sparkles -->
  <circle cx="120" cy="120" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="390" cy="140" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="380" cy="380" r="3" fill="#f43f5e" opacity="0.8"/>
  <circle cx="130" cy="370" r="4" fill="#a855f7" opacity="0.8"/>
</svg>
