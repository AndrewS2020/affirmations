<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Wasteland 3D - Explorable Landscape</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #webgl-canvas { width: 100%; height: 100%; display: block; }
      #ui-overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(18, 24, 32, 0.75);
        backdrop-filter: blur(16px);
        padding: 14px 20px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
        user-select: none;
        z-index: 10;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      #ui-overlay h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; color: #fbbf24; }
      #ui-overlay p { font-size: 12px; color: rgba(255, 255, 255, 0.65); line-height: 1.5; }
      #stats-badge {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 8px;
        border-radius: 6px;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <h1>Alien Wasteland • 20km Procedural Scene</h1>
      <p>Left Drag: Orbit • Right Drag: Pan • Scroll: Zoom</p>
      <div id="stats-badge">LOD Terrain • Volumetric Fog • Raymarched Clouds • Instanced Ruins</div>
    </div>
    <canvas id="webgl-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
